schema_version: 1

context:
  name: pcl
  version: "1.15.1"
  major_version: ${{ (version | split('.'))[0] }}
  minor_version: ${{ (version | split('.'))[1] }}
  sha256: e1d862c7b6bd27a45884a825a2e509bfcbd4561307d5bfe17ce5c8a3d94a6c29

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/pointcloudlibrary/${{ name }}/archive/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  patches:
    - 6354.patch
    - 6394.patch
    - 6412.patch
    - 6456.patch
    - boost-system-header-only.patch

build:
  number: 17
  string: ${{ pcl_variant }}_h${{ hash }}_${{ build_number }}
  variant:
    # Prefer the gui variant (the historical default) unless headless is requested explicitly
    down_prioritize_variant: ${{ 1 if pcl_variant == "headless" else 0 }}

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - cmake
    - if: win
      then: ninja
    - if: unix
      then: make
    - pkgconfig
    - if: build_platform != target_platform and pcl_variant == "gui"
      then: qt6-main
  host:
    - if: linux and pcl_variant == "gui"
      then: xorg-libxfixes
    - if: linux and pcl_variant == "gui"
      then: libgl-devel
    - flann
    - nanoflann
    - eigen
    - eigen-abi-devel
    - libboost-devel
    - if: win
      then: tbb-devel
    - qhull
    - libpng
    - if: pcl_variant == "gui"
      then:
        - vtk
        - glew
    - if: pcl_variant == "gui" and not ppc64le
      then: qt6-main
  run:
    # These dependencies are required for find_package(PCL) to work, they can be moved to a pcl-devel package if that is created
    - flann
    - nanoflann
    - qhull
    - eigen
    - libboost-devel
    - if: pcl_variant == "gui"
      then:
        - glew
        - vtk
  run_exports:
    # Packages built against the gui variant may link pcl_visualization, which headless lacks
    - if: pcl_variant == "gui"
      then: ${{ pin_subpackage('pcl', upper_bound='x.x.x', build='gui_*') }}
      else: ${{ pin_subpackage('pcl', upper_bound='x.x.x') }}

tests:
  - requirements:
      run:
        - cmake-package-check
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
    script:
      - if: not win
        then: test -d $PREFIX/include/${{ name }}-${{ major_version }}.${{ minor_version }}/${{ name }}
      - if: win
        then: if not exist %LIBRARY_INC%\\${{ name }}-${{ major_version }}.${{ minor_version }}\\${{ name }} exit 1
      - cmake-package-check PCL
      # The visualization module must only be part of the gui variant
      - if: linux and pcl_variant == "gui"
        then: test -f $PREFIX/lib/libpcl_visualization.so
      - if: linux and pcl_variant == "headless"
        then: test ! -f $PREFIX/lib/libpcl_visualization.so
      - if: osx and pcl_variant == "gui"
        then: test -f $PREFIX/lib/libpcl_visualization.dylib
      - if: osx and pcl_variant == "headless"
        then: test ! -f $PREFIX/lib/libpcl_visualization.dylib
      - if: win and pcl_variant == "gui"
        then: if not exist %LIBRARY_LIB%\\pcl_visualization.lib exit 1
      - if: win and pcl_variant == "headless"
        then: if exist %LIBRARY_LIB%\\pcl_visualization.lib exit 1

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Point Cloud Library (PCL)
  description: |
    The Point Cloud Library (PCL) is a standalone, large scale, open project for 2D/3D image and point cloud processing.
  homepage: http://www.pointclouds.org
  repository: https://github.com/pointcloudlibrary/pcl
  documentation: http://www.pointclouds.org

extra:
  recipe-maintainers:
    - oursland
    - chambbj
    - hobu
    - Tobias-Fischer
    - traversaro
