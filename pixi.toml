# -*- mode: toml -*-
# This file was generated automatically from conda-smithy. To update this configuration,
# update the conda-forge.yml and/or the recipe/meta.yaml.
"$schema" = "https://pixi.sh/v0.59.0/schema/manifest/schema.json"

[workspace]
name = "pcl-feedstock"
version = "2026.11.6"  # conda-smithy version used to generate this file
description = "Pixi configuration for conda-forge/pcl-feedstock"
authors = ["@conda-forge/pcl"]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64", "win-arm64"]
requires-pixi = ">=0.59.0"

[tasks.build-locally]
cmd = "pixi exec --force-reinstall --list='^python$' python ./build-locally.py"
description = "Build packages locally using the same setup scripts used in conda-forge's CI"
[tasks.smithy]
cmd = "pixi exec --force-reinstall --list='^conda-smithy$' conda-smithy"
description = "Run conda-smithy. Pass necessary arguments."
[tasks.rerender]
cmd = "pixi exec --force-reinstall --list='^conda-smithy$' conda-smithy rerender"
description = "Rerender the feedstock."

[tasks.lint]
cmd = "pixi exec --list='^conda-smithy$' conda-smithy lint --conda-forge recipe"
description = "Lint the feedstock recipe"

[feature.build.dependencies]
conda-build = ">=26.3"
conda-forge-ci-setup = "4.*"
python = "3.14.*"
rattler-build = "*"

[feature.build.tasks.inspect-all]
cmd = "inspect_artifacts --all-packages"
description = "List contents of all packages found in rattler-build build directory."
[feature.build.tasks.build]
cmd = "rattler-build build --recipe recipe"
description = "Build pcl-feedstock directly (without setup scripts), no particular variant specified"
[feature.build.tasks."build-linux_64_pcl_variantgui"]
cmd = "rattler-build build --recipe recipe -m .ci_support/linux_64_pcl_variantgui.yaml --target-platform linux-64"
description = "Build pcl-feedstock with variant linux_64_pcl_variantgui directly (without setup scripts)"
[feature.build.tasks."debug-linux_64_pcl_variantgui"]
cmd = "rattler-build debug setup --recipe recipe -m .ci_support/linux_64_pcl_variantgui.yaml --target-platform linux-64"
description = "Debug pcl-feedstock with variant linux_64_pcl_variantgui directly (without setup scripts)"
[feature.build.tasks."inspect-linux_64_pcl_variantgui"]
cmd = "inspect_artifacts --recipe-dir recipe -m .ci_support/linux_64_pcl_variantgui.yaml"
description = "List contents of pcl-feedstock packages built for variant linux_64_pcl_variantgui"
[feature.build.tasks."build-linux_64_pcl_variantheadless"]
